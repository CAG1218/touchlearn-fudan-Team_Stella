[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touchlearn"
version = "0.2.0"
description = "Turn multimodal STEM requests into printable tactile plates and 3D models with standards checks and audio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team Stella" }]
keywords = ["accessibility", "tactile-graphics", "braille", "3d-printing", "stem-education"]
dependencies = ["qrcode[pil]>=7.4"]

[project.optional-dependencies]
dev = ["jsonschema>=4.22", "pytest>=8.0", "pypdf>=4.0"]
qr = ["qrcode[pil]>=7.4"]
docs-reader = ["pypdf>=4.0"]

[project.scripts]
touchlearn = "touchlearn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
touchlearn = ["data/*.json"]
"touchlearn.agent" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
