name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Validate both examples
        run: |
          python -m touchlearn validate examples/robot_arm/diagram.json
          python -m touchlearn validate examples/quadratic/diagram.json

      - name: Build both examples
        run: python scripts/build_examples.py

      - name: Check tactile constraints
        run: |
          python -m touchlearn check examples/robot_arm/diagram.json
          python -m touchlearn check examples/quadratic/diagram.json
